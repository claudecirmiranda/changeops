name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  validate-change-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/change-service  # ← aponta pro pom.xml correto

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Testes e cobertura (Jacoco)
        run: mvn -B verify

      - name: Falha se cobertura < 80%
        run: |
          mvn -B jacoco:check \
            -Djacoco.minimum.line=0.80 \
            -Djacoco.minimum.branch=0.70

      - name: Checkstyle
        run: mvn -B checkstyle:check

      - name: OWASP Dependency Check
        run: mvn -B dependency-check:check
        continue-on-error: true

      - name: SonarCloud Analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=meu-projeto-backend \
            -Dsonar.organization=minha-org \
            -Dsonar.host.url=https://sonarcloud.io

  validate-deploy-orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/deploy-orchestrator  # ← idem

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Testes e cobertura (Jacoco)
        run: mvn -B verify

      - name: Falha se cobertura < 80%
        run: |
          mvn -B jacoco:check \
            -Djacoco.minimum.line=0.80 \
            -Djacoco.minimum.branch=0.70

      - name: Checkstyle
        run: mvn -B checkstyle:check

      - name: OWASP Dependency Check
        run: mvn -B dependency-check:check
        continue-on-error: true
