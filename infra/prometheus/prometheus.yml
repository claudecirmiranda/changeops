global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:

  - job_name: 'change-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['change-service:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: change-service

  - job_name: 'deploy-orchestrator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['deploy-orchestrator:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: deploy-orchestrator

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9101']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
