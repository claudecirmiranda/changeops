spring:
  application:
    name: deploy-orchestrator

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:changeops}
    username: ${DB_USER:changeops}
    password: ${DB_PASS:changeops}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Use a separate history table so orchestrator migrations don't conflict
    # with change-service migrations in the shared database
    table: flyway_schema_history_orchestrator
    # Schema already populated by change-service; baseline so Flyway doesn't
    # reject the non-empty schema when creating its own history table
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      properties:
        spring.json.trusted.packages: com.changeops.*

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        spring.kafka.listener: true
    export:
      prometheus:
        enabled: true
    tags:
      application: deploy-orchestrator

changeops:
  kafka:
    default-replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
    consumer:
      group-id: deploy-orchestrator-group
    topics:
      deploy-finished: changeops.deploy.finished
      change-result: changeops.change.result
      dlq: changeops.change.result-dlt
